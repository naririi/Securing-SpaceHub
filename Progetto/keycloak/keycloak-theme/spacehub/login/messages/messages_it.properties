loginTitleHtml=<div style="background-color: #fff3cd; color: #856404; padding: 15px; margin-bottom: 20px; border: 1px solid #ffeeba; border-radius: 4px; font-size: 13px; text-align: left; line-height: 1.4; font-family: sans-serif;"><strong>⚠️ ATTENZIONE - SISTEMA ISTITUZIONALE PROTETTO</strong><br/><br/>1. Stai accedendo a un sistema informativo dell'Ateneo protetto da crittografia avanzata.<br/>2. Tutte le operazioni e gli accessi sono soggetti a registrazione e monitoraggio continuo (Audit Logging).<br/>3. L'uso non autorizzato, l'alterazione dei dati o il furto di sessione sono severamente proibiti e perseguibili per legge.<br/>4. L'inserimento delle credenziali implica il pieno consenso a tali condizioni di sicurezza.</div><br/><span style="font-size: 18px; color: #333; font-weight: bold;">Accedi a SpaceHub</span>

termsTitle=Condizioni d'Uso e Policy di Sicurezza di SpaceHub

termsText=<div style="text-align: left; padding: 10px; font-size: 14px; line-height: 1.5; color: #333;"><strong>1. Accesso e Audit Logging</strong><br/>L'accesso a SpaceHub è strettamente personale. Tutte le operazioni effettuate (es. prenotazione aule, sblocco varchi tramite Smart Card) sono registrate in log sicuri e costantemente monitorate per garantire l'integrità dell'infrastruttura.<br/><br/><strong>2. Protezione delle Credenziali</strong><br/>La comunicazione è protetta da crittografia end-to-end. È severamente vietato cedere le proprie credenziali a terzi o permettere l'accesso fisico ad altre persone utilizzando il proprio account o il proprio badge.<br/><br/><strong>3. Gestione Sessione e Logout Obbligatorio</strong><br/>A tutela dell'autenticità della sessione, il sistema applica meccanismi di disconnessione automatica (timeout) in caso di inattività. <strong>Terminato l'utilizzo, è fatto obbligo assoluto all'utente di effettuare il logout manuale dal sistema e chiudere il browser.</strong><br/><br/><strong>4. Conseguenze Legali</strong><br/>Qualsiasi tentativo di accesso non autorizzato o abuso dei permessi comporterà la sospensione immediata dell'account e la segnalazione alle autorità di Ateneo.<br/><br/><strong>5. Consenso</strong><br/>Cliccando su "Accetto", dichiari di aver letto le presenti policy di sicurezza e autorizzi il trattamento dei log e dei dati necessari al funzionamento di SpaceHub.</div>