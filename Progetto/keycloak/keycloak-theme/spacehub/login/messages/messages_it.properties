loginTitleHtml=<div style="background-color: #fff3cd; color: #856404; padding: 15px; margin-bottom: 20px; border: 1px solid #ffeeba; border-radius: 4px; font-size: 13px; text-align: left; line-height: 1.4; font-family: sans-serif;"><strong>⚠️ ATTENZIONE - SISTEMA ISTITUZIONALE</strong><br/><br/>1. Stai accedendo a un sistema informativo dell'Ateneo.<br/>2. L'utilizzo del sistema è soggetto a monitoraggio e registrazione (Audit Log).<br/>3. L'uso non autorizzato è severamente proibito e perseguibile per legge.<br/>4. L'inserimento delle credenziali implica il pieno consenso a tali condizioni.</div><br/><span style="font-size: 18px; color: #333; font-weight: bold;">Accedi a SpaceHub</span>

termsTitle=Condizioni d'Uso e Privacy Policy di SpaceHub
termsText=<div style="text-align: left; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9; max-height: 200px; overflow-y: auto; font-size: 14px;"><strong>1. Accesso e Monitoraggio</strong><br/>L'accesso a SpaceHub è strettamente personale e riservato al personale autorizzato e agli studenti iscritti. Tutte le operazioni effettuate nel sistema (es. prenotazione aule, sblocco varchi) sono registrate e monitorate per garantire la sicurezza dell'infrastruttura (Audit Logging).<br/><br/><strong>2. Divieto di Condivisione</strong><br/>È severamente vietato cedere le proprie credenziali a terzi o permettere l'accesso fisico ad altre persone utilizzando il proprio account o Smart Card.<br/><br/><strong>3. Conseguenze Legali</strong><br/>Qualsiasi tentativo di accesso non autorizzato, alterazione dei dati o abuso dei permessi concessi comporterà la sospensione immediata dell'account e la segnalazione alle autorità competenti dell'Ateneo.<br/><br/><strong>4. Consenso</strong><br/>Cliccando su "Accetto", dichiari di aver letto e compreso le presenti condizioni e autorizzi il trattamento dei dati necessari al funzionamento di SpaceHub.</div>