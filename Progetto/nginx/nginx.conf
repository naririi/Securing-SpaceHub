# --- SETUP
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # per far girare nginx come no root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # nasconde la versione esatta di Nginx negli header
    server_tokens off;

    # --- REDIRECT HTTP -> HTTPS
    server {
        listen 8080;
        server_name localhost; # Sostituisci con il tuo dominio reale se vai in produzione

        return 301 https://$host$request_uri;
    }

    # --- SERVER HTTPS
    server {
        listen 8443 ssl;
        server_name localhost;

        # --- CONFIGURAZIONE TLS 1.3
        ssl_certificate     /etc/nginx/certs/webapp.crt;
        ssl_certificate_key /etc/nginx/certs/webapp.key;
        
        # forza TLS 1.3
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off; 

        # --- HEADER DI SICUREZZA ---
        # HSTS: forza i browser a usare solo HTTPS per i prossimi 2 anni
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        # previene attacchi Clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # blocca il caricamento di script malevoli mascherati
        add_header X-Content-Type-Options "nosniff" always;
        # forza la XSS protection sui browser legacy
        add_header X-XSS-Protection "1; mode=block" always;

        # --- GESTIONE FRONTEND (REACT) ---
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            
            try_files $uri $uri/ /index.html;
        }

        # --- GESTIONE BACKEND (NODE.JS API) ---
        location /api/ {
            proxy_pass https://backend:3000;
            
            # forza TLS 1.3
            proxy_ssl_protocols TLSv1.3;
            
            # header per inoltrare le info corrette
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 20s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
        }
    }
}