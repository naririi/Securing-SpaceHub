loginTitleHtml=<div style="background-color: #fff3cd; color: #856404; padding: 15px; margin-bottom: 20px; border: 1px solid #ffeeba; border-radius: 4px; font-size: 13px; text-align: left; line-height: 1.4; font-family: sans-serif;"><strong>⚠️ WARNING - INSTITUTIONAL SYSTEM</strong><br/><br/>1. You are accessing an Institutional Information System.<br/>2. System usage is monitored, recorded, and subject to audit.<br/>3. Unauthorized use is prohibited and subject to criminal and civil penalties.<br/>4. Use of the system indicates your explicit consent to these conditions.</div><br/><span style="font-size: 18px; color: #333; font-weight: bold;">Sign in to SpaceHub</span>

termsTitle=SpaceHub Terms of Use and Privacy Policy
termsText=<div style="text-align: left; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background: #f9f9f9; max-height: 200px; overflow-y: auto; font-size: 14px;"><strong>1. Access and Monitoring</strong><br/>Access to SpaceHub is strictly personal and reserved for authorized personnel and enrolled students. All system operations are logged and monitored for security purposes.<br/><br/><strong>2. No Sharing Policy</strong><br/>It is strictly forbidden to share credentials or grant physical access to others using your account or Smart Card.<br/><br/><strong>3. Legal Consequences</strong><br/>Unauthorized access or misuse of privileges will result in immediate account suspension and reporting to University authorities.<br/><br/><strong>4. Consent</strong><br/>By clicking "Accept", you acknowledge these terms and consent to the necessary data processing for SpaceHub operations.</div>